name: Keepalive (prevents 60-day inactivity disable)
# GitHub disables scheduled workflows in public repos after 60 days without
# repository activity. Re-enabling an active workflow via the API resets that
# timer. Only workflows that are currently "active" are touched, so anything
# disabled manually stays disabled.
on:
  schedule:
    - cron: '17 4 1 * *'   # 1st of every month, 04:17 UTC
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable active workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state=="active") | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -X PUT "repos/$REPO/actions/workflows/$id/enable" && echo "kept alive: $name"
          done
