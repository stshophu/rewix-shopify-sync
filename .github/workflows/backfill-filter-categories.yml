name: Backfill filter categories (Manual)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Type 'apply' to write the metafields. Leave blank for a dry run."
        required: false
        default: ''
      in_stock_only:
        description: "Type 'yes' to limit to in-stock products (default: all active + draft products)."
        required: false
        default: ''

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run backfill
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.apply }}" = "apply" ]; then ARGS="$ARGS --apply"; fi
          if [ "${{ github.event.inputs.in_stock_only }}" = "yes" ]; then ARGS="$ARGS --in-stock-only"; fi
          node backfill_filter_categories.cjs $ARGS
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-filter-report
          path: backfill_filter_report.csv
